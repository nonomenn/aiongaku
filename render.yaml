# Render Blueprint（Infrastructure as Code）。
# Render の「New > Blueprint」からこのリポジトリを選ぶと読み込まれる。
# 手順は DEPLOY.md を参照。
#
# 共有用リポジトリ（nonomenn/aiongaku）ではこのファイルがリポジトリ直下に来るため
# rootDir の指定は不要。AI- リポジトリの amps/ 配下で使う場合のみ、
# Render 側で rootDir に amps を指定すること。

services:
  - type: web
    name: amps-dashboard
    runtime: docker
    plan: starter          # 永続ディスクは有料プランが必要（無料プランでは使えない）
    healthCheckPath: /_stcore/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # Render の管理画面で手入力する。リポジトリには絶対に置かない
      - key: AMPS_DASHBOARD_PASSWORD
        sync: false        # 同上。強いパスワードを設定すること
      - key: SUNO_API_KEY
        sync: false        # 同上。音源生成を使わないなら空でよい
      - key: AMPS_DATA_DIR
        value: /data        # 永続ディスクのマウント先（下の disk.mountPath と一致させる）
      - key: AMPS_AUTH_REQUIRED
        value: "true"       # 本番では必ず true（パスワード未設定なら起動を拒否する）
      - key: AMPS_MODEL
        value: claude-sonnet-5
      - key: SUNO_MONTHLY_GENERATION_CAP
        value: "150"
    disk:
      name: amps-data
      mountPath: /data
      sizeGB: 1
